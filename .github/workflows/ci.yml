name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, format, types and the suite, from the shared workflow in PNX89/.github, pinned to a tag
  # rather than a moving branch so a commit elsewhere cannot turn this badge red.
  #
  # mypy runs on every leg rather than once. The package claims 3.11 upwards, and a union or a
  # generic that only type checks on the newest interpreter is exactly what a single version type
  # check leg lets through.
  #
  # What the pipeline is for, and the five things it deliberately does not gate, is at
  # https://github.com/PNX89/.github/blob/main/docs/adr/0001-what-ci-is-for.md
  checks:
    name: linux
    uses: PNX89/.github/.github/workflows/checks.yml@v1
    with:
      python-versions: '["3.11", "3.12", "3.13"]'
      run-mypy: true
      pytest-args: ""

  # macOS is required rather than a nicety, and it is a separate call because it is a separate
  # claim: the README says the server runs with no MetaTrader install anywhere, and a Linux only
  # matrix does not back that.
  checks-macos:
    name: macos
    uses: PNX89/.github/.github/workflows/checks.yml@v1
    with:
      runs-on: macos-latest
      python-versions: '["3.13"]'
      run-mypy: true
      pytest-args: ""

  windows-mt5:
    name: windows python 3.12 with the mt5 extra
    runs-on: windows-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --dev --extra mt5
      - run: uv run pytest
      # The only place the Windows install path is exercised at all. There is no terminal on
      # a runner, so the assertion is that the extension imports and that a missing terminal
      # is reported as a clean SourceUnavailable rather than an AttributeError or a hang.
      - name: The extension imports and a missing terminal is reported cleanly
        shell: bash
        run: |
          uv run python -c '
          import MetaTrader5

          from quotez.errors import SourceUnavailable
          from quotez.mt5source import Mt5Source

          assert MetaTrader5.__name__ == "MetaTrader5"
          try:
              Mt5Source(timeout_ms=5000).connect()
          except SourceUnavailable as failure:
              assert "MetaTrader 5" in str(failure), failure
          else:
              raise SystemExit("connect() succeeded on a runner with no terminal")
          '

  macos-mt5-marker:
    name: macos python 3.12, the mt5 extra resolves to nothing
    runs-on: macos-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv venv
      # MetaTrader5 publishes win_amd64 wheels and no source distribution, so without the
      # environment marker this fails at RESOLUTION rather than at import. It must be a no-op.
      - run: uv pip install '.[mt5]'
      - name: The extra resolved to nothing and the package still imports
        run: |
          .venv/bin/python -c "
          import importlib.util
          assert importlib.util.find_spec('MetaTrader5') is None, 'the marker let MetaTrader5 in'
          import quotez
          print(quotez.__version__)
          "

  python-3-14:
    name: ubuntu python 3.14 (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --dev
      - run: uv run pytest
