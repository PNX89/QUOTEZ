<text x="18" y="34" class="cmd" style="animation:l0 5850ms steps(1,end) infinite">$ uv run python examples/agent_session.py</text><text x="18" y="53" style="animation:l1 5850ms steps(1,end) infinite"></text><text x="18" y="72" style="animation:l2 5850ms steps(1,end) infinite">QUOTEZ over an in-memory MCP client, source=replay.</text><text x="18" y="91" style="animation:l3 5850ms steps(1,end) infinite">Every price below is generated. This repository bundles no real market data.</text><text x="18" y="110" style="animation:l4 5850ms steps(1,end) infinite"></text><text x="18" y="129" style="animation:l5 5850ms steps(1,end) infinite">&gt;&gt;&gt; list_symbols(group=&quot;*FX*&quot;)</text><text x="18" y="148" style="animation:l6 5850ms steps(1,end) infinite">{</text><text x="18" y="167" style="animation:l7 5850ms steps(1,end) infinite">  &quot;source&quot;: &quot;replay&quot;,</text><text x="18" y="186" style="animation:l8 5850ms steps(1,end) infinite">  &quot;synthetic&quot;: true,</text><text x="18" y="205" style="animation:l9 5850ms steps(1,end) infinite">  &quot;count&quot;: 2,</text><text x="18" y="224" style="animation:l10 5850ms steps(1,end) infinite">  &quot;symbols&quot;: [</text><text x="18" y="243" style="animation:l11 5850ms steps(1,end) infinite">    {&quot;name&quot;: &quot;SYNTH_FX_ALPHA&quot;, &quot;description&quot;: &quot;Synthetic FX pair Alpha&quot;, &quot;digits&quot;: 5, &quot;point&quot;...</text><text x="18" y="262" style="animation:l12 5850ms steps(1,end) infinite">    {&quot;name&quot;: &quot;SYNTH_FX_BETA&quot;, &quot;description&quot;: &quot;Synthetic FX pair Beta&quot;, &quot;digits&quot;: 3, &quot;point&quot;: ...</text><text x="18" y="281" style="animation:l13 5850ms steps(1,end) infinite">  ]</text><text x="18" y="300" style="animation:l14 5850ms steps(1,end) infinite">}</text><text x="18" y="319" style="animation:l15 5850ms steps(1,end) infinite"></text><text x="18" y="338" style="animation:l16 5850ms steps(1,end) infinite">&gt;&gt;&gt; get_quote(symbol=&quot;SYNTH_FX_ALPHA&quot;)</text><text x="18" y="357" style="animation:l17 5850ms steps(1,end) infinite">{</text><text x="18" y="376" style="animation:l18 5850ms steps(1,end) infinite">  &quot;symbol&quot;: &quot;SYNTH_FX_ALPHA&quot;,</text><text x="18" y="395" style="animation:l19 5850ms steps(1,end) infinite">  &quot;time&quot;: &quot;2026-06-12T13:59:00Z&quot;,</text><text x="18" y="414" style="animation:l20 5850ms steps(1,end) infinite">  &quot;bid&quot;: 1.08044,</text><text x="18" y="433" style="animation:l21 5850ms steps(1,end) infinite">  &quot;ask&quot;: 1.08056,</text><text x="18" y="452" style="animation:l22 5850ms steps(1,end) infinite">  &quot;spread_points&quot;: 12,</text><text x="18" y="471" style="animation:l23 5850ms steps(1,end) infinite">  &quot;source&quot;: &quot;replay&quot;,</text><text x="18" y="490" style="animation:l24 5850ms steps(1,end) infinite">  &quot;synthetic&quot;: true</text><text x="18" y="509" style="animation:l25 5850ms steps(1,end) infinite">}</text><text x="18" y="528" style="animation:l26 5850ms steps(1,end) infinite"></text><text x="18" y="547" style="animation:l27 5850ms steps(1,end) infinite">&gt;&gt;&gt; get_bars(symbol=&quot;SYNTH_FX_ALPHA&quot;, timeframe=&quot;H1&quot;, count=5)</text><text x="18" y="566" style="animation:l28 5850ms steps(1,end) infinite"></text><text x="18" y="585" style="animation:l29 5850ms steps(1,end) infinite">... 43 more lines, in full on the card</text>
