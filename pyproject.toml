[project]
name = "quotez"
version = "0.1.0"
description = "MetaTrader 5 market data as typed, read-only MCP tools."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Quelin Zammit" }]
keywords = ["mcp", "metatrader5", "market-data", "trading", "llm-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
# THE RANGE STAYS WIDE, AND I NEARLY NARROWED IT ON A CLAIM I HAD NOT MEASURED. Raising a
# deliberate `ToolError` produces the same text on 2.0.0 and on 2.1.1, so the committed
# transcript is byte identical under both and the whole suite passes under both. It was tested
# rather than assumed, after a first attempt at this commit asserted a difference that the
# unchanged README was already disproving.
dependencies = ["mcp>=2.0.0,<3"]

# MetaTrader5 ships win_amd64 wheels only and no source distribution, so without this
# marker `pip install quotez[mt5]` fails at RESOLUTION on macOS and Linux, before any
# lazy import could help.
[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45,<6; sys_platform == 'win32'"]

[project.scripts]
quotez = "quotez.cli:main"

[project.urls]
Homepage = "https://github.com/PNX89/QUOTEZ"
Source = "https://github.com/PNX89/QUOTEZ"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The `cli` extra is what provides `mcp dev`, `mcp run` and `mcp install`. It is a dev
# tool; the runtime dependency stays plain `mcp`. `packaging` is here because
# tests/test_package.py parses the distribution's own requirement markers with it; it used
# to arrive only as a transitive dependency of pytest, which is not a thing to rely on.
[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "anyio>=4.9",
    "mcp[cli]>=2.0.0,<3",
    "mypy>=1.11",
    "packaging>=24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quotez"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

# `py.typed` and the `Typing :: Typed` classifier are promises to a consumer's type checker,
# so something has to keep them true. `src` only, deliberately: the tests drive the SDK's
# client, whose content lists are unions of five block types, and asserting on `.text` there
# would need a cast or an isinstance guard at every call. That is noise in a test, and the
# promise the marker makes is about the package a consumer imports.
[tool.mypy]
files = ["src"]
strict = true

# MetaTrader5 ships no stubs and no py.typed, and no wheel exists off Windows, so the import
# is unresolvable on every runner in the matrix. `_mt5()` casts the result back to a module.
[[tool.mypy.overrides]]
module = "MetaTrader5"
ignore_missing_imports = true
